<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DBS Ind</title>
<meta name="theme-color" content="#ffb31b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DBS Ind">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f3f3f3;font-family:Arial,sans-serif;color:#161616}
button,input,textarea{font:inherit}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:#fff;color:#161616;overflow:hidden}

/* compact white + gold look based on the supplied DBS reference */
.top{height:54px;padding:16px 18px;background:#fff;color:#161616;font-size:14px;font-weight:700;border-bottom:1px solid #ececec}
.homeTop{background:#ffb31b;border-bottom:0;height:50px}
.hero{min-height:200px;padding:30px 20px;background:linear-gradient(135deg,#f6a514,#ffc531 65%,#f2a313);color:#171717}
.hero h1{font-size:28px;line-height:1.1;margin:38px 0 10px}
.hero p{font-size:13px;line-height:1.4;margin:0}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;padding:15px 10px;background:#fff}
.item{text-align:center;font-size:10px;line-height:1.2;cursor:pointer;color:#333}
.icon{width:44px;height:38px;border:1px solid #dedede;border-radius:8px;margin:0 auto 6px;display:grid;place-items:center;font-size:18px;color:#e5302a;background:#fff}

.btn{width:calc(100% - 32px);margin:14px 16px;padding:13px;border:0;border-radius:4px;background:#d93428;color:#fff;font-size:13px;font-weight:700}
.login{padding:0 22px 28px;text-align:center;min-height:100vh;background:#fff;color:#161616}
.login>b{display:block;margin:0 -22px 34px;padding:22px;background:#ffb31b;text-align:left;font-size:14px}
.avatar{margin:45px auto 10px;width:68px;height:68px;border-radius:50%;background:#f0f0f0;color:#8a8a8a;display:grid;place-items:center;font-size:28px}
input,textarea{width:100%;padding:12px 13px;margin:7px 0;border:1px solid #d8d8d8;border-radius:4px;background:#fff;color:#222;font-size:13px}

.light,.page{background:#fff;color:#222}
.welcome{padding:16px 18px 18px;background:linear-gradient(135deg,#f6a514,#ffc531 65%,#f2a313);color:#171717}
.welcome h1{font-size:18px;line-height:1.12;margin:0 0 6px}
.welcome p{font-size:11px;line-height:1.35;margin:0}
.homeActions{border-bottom:1px solid #eee}

.insightCard{margin:10px 12px;padding:11px;border:1px solid #e5e5e5;border-radius:4px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04);font-size:11px}
.insightCard b{font-size:12px}
.account{margin:0;padding:13px 14px;background:#fff;border-top:1px solid #eee;border-bottom:1px solid #eee;cursor:pointer;font-size:11px}
.account h3{font-size:13px;margin:0 0 8px}
.account p{margin:5px 0;color:#777}
.account .balance{font-size:12px;text-align:right;margin-top:-8px}
.account .balance b{font-size:16px;color:#111}

.tabs{display:flex;background:#fff}
.tabs div{width:50%;padding:12px;text-align:center;border-bottom:1px solid #ddd;font-size:12px}
.tabs div:first-child{border-bottom:2px solid #d79a16}

.card,.choice{margin:8px 12px;padding:13px;background:#fff;color:#222;border:1px solid #e4e4e4;border-radius:5px;font-size:12px}
.choice{display:block;width:calc(100% - 24px);text-align:left;cursor:pointer}
.page{min-height:calc(100vh - 54px);padding:10px 0 24px}
.page h2{font-size:16px;margin:12px 0 10px;padding-left:14px;padding-right:14px}
.page p{font-size:12px;line-height:1.45;padding-left:14px;padding-right:14px}
.back{font-size:22px;margin-right:11px;cursor:pointer;vertical-align:-1px}
.check{text-align:center;font-size:54px;color:#2a5;margin-top:20px}
.scan{height:280px;margin:12px;background:#f2f2f2;color:#333;border:1px solid #ddd;display:grid;place-items:center;text-align:center;border-radius:7px;font-size:12px}
.small{font-size:10px}
.sectionLabel{font-size:9px;color:#777;padding:10px 14px 5px;text-transform:uppercase;letter-spacing:.2px}
.listrow{margin:0 12px;padding:13px 2px;border-bottom:1px solid #ececec;font-size:12px;cursor:pointer}.balrow{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid #ededed;font-size:12px}.balrow:last-child{border-bottom:0}.balrow span{color:#666}.balrow b{text-align:right;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var balance="₹15,56,431.49";
var uid="9985533631";

function set(html){app.innerHTML=html;window.scrollTo(0,0)}
function header(title,back){
  return '<div class="top"><span class="back" data-go="'+back+'">‹</span>'+title+'</div>';
}
function bind(){
  var nodes=document.querySelectorAll("[data-go]");
  for(var i=0;i<nodes.length;i++){
    nodes[i].onclick=function(){go(this.getAttribute("data-go"));};
  }
}
function render(html){set(html);bind();}

function landing(){
 render(
 '<div class="top">✦ digibank <span class="small">by DBS</span></div>'+
 '<div class="hero"><h1>Live more</h1><p>Simple everyday banking from your phone.</p></div>'+
 '<div class="grid">'+
 tile("＋","Add Money","login")+tile("▣","Pay Bills","login")+
 tile("⌗","Scan & Pay","login")+tile("⇄","Transfer","login")+
 tile("₹","Personal Loan","login")+tile("◎","Overseas Transfer","login")+
 tile("▤","digiPortfolio","login")+tile("⋮","More","login")+
 '</div><button class="btn" data-go="login">LOGIN</button>'
 );
}
function tile(icon,label,target){
 return '<div class="item" data-go="'+target+'"><div class="icon">'+icon+'</div>'+label+'</div>';
}
function login(){
 render('<div class="login"><b>✦ digibank <span class="small">by DBS</span></b>'+
 '<div class="avatar">♙</div><div>'+uid+'</div>'+
 '<input id="pw" type="password" placeholder="Password" autocomplete="off">'+
 '<div style="text-align:left;margin-top:8px">Trouble logging in?</div>'+
 '<button class="btn" data-go="home">LOGIN</button></div>');
}
function home(){
 render('<div class="top homeTop">☰<span style="float:right">♧　▢</span></div>'+
 '<div class="welcome"><h1>Welcome to the unbank,<br>digibank by DBS!</h1><p>Secure your savings with simple everyday banking.</p></div>'+
 '<div class="grid homeActions">'+tile("＋","Add Money","addmoney")+tile("⇄","Transfer","transfer")+
 tile("▣","Pay Bills","bills")+tile("⌗","Scan & Pay","scan")+'</div>'+
 '<div class="insightCard" data-go="insights"><b>Your Insights</b><br><span class="small">Personalised insights for your finances</span></div>'+
 '<div class="account" data-go="accountdetails"><h3>Account <span style="float:right">›</span></h3><b>DIGISAVINGS</b>'+
 '<p>********45508</p><div class="balance">Balance<br><b>'+balance+'</b></div></div>'+
 '<div class="listrow" data-go="upi"><b>UPI Linked Accounts</b><span style="float:right">›</span></div>'+
 '<div class="sectionLabel">Do more with digibank</div>'+
 '<div class="grid">'+tile("₹","Personal Loan","loan")+tile("◎","Overseas","overseas")+
 tile("▤","digiPortfolio","portfolio")+tile("⋮","More","more")+'</div>');
}
function accountdetails(){
 render(header("Account","home")+'<div class="page">'+
 '<div class="card"><h2 style="padding:0;margin:0 0 10px;font-size:15px">DIGISAVINGS</h2>'+
 '<p style="padding:0;margin:0 0 4px">Account number</p><b>********45508</b>'+
 '<div style="margin-top:14px">'+
 '<div class="balrow"><span>Available balance</span><b>'+balance+'</b></div>'+
 '<div class="balrow"><span>Linked deposited balance</span><b>₹0.00</b></div>'+
 '<div class="balrow"><span>Net withdrawal amount balance</span><b>'+balance+'</b></div>'+
 '</div></div></div>');
}
function transfer(){
 render(header("Transfer","home")+'<div class="page"><h2>Transfer Money</h2>'+
 choice("To Bank Account / Beneficiary","beneficiaries")+
 choice("To UPI ID","amount")+
 choice("To Own Account","amount")+
 choice("Overseas Transfer","overseas")+'</div>');
}
function beneficiaries(){
 render(header("Beneficiaries","transfer")+'<div class="page"><h2>Select Beneficiary</h2>'+
 choice("Saved Beneficiary ••••1024","amount")+
 choice("＋ Add New Beneficiary","addbeneficiary")+'</div>');
}
function addbeneficiary(){
 render(header("Add Beneficiary","beneficiaries")+'<div class="page" style="padding:18px">'+
 '<input placeholder="Beneficiary name"><input placeholder="Account number" inputmode="numeric">'+
 '<input placeholder="Re-enter account number" inputmode="numeric"><input placeholder="IFSC code">'+
 '<button class="btn" style="width:100%;margin:16px 0" data-go="amount">CONTINUE</button></div>');
}
function amount(){
 render(header("Transfer","transfer")+'<div class="page" style="padding:18px"><h2>Enter amount</h2>'+
 '<input inputmode="decimal" placeholder="₹0"><textarea placeholder="Remarks (optional)"></textarea>'+
 '<button class="btn" style="width:100%;margin:16px 0" data-go="review">CONTINUE</button></div>');
}
function review(){
 render(header("Review","amount")+'<div class="page"><h2>Review</h2>'+
 '<div class="card"><b>Payment details</b><p>From: DIGISAVINGS ••••5508</p><p>Available balance: '+balance+'</p></div>'+
 '<button class="btn" data-go="success">CONFIRM</button></div>');
}
function success(){
 render(header("Transfer","home")+'<div class="page"><div class="check">✓</div>'+
 '<h2 style="text-align:center">Successful</h2><p style="text-align:center">Request completed</p>'+
 '<h2 style="text-align:center">'+balance+'</h2><button class="btn" data-go="home">DONE</button></div>');
}
function bills(){
 var names=["Electricity","Mobile Postpaid","DTH","Broadband","Gas","Credit Card","Insurance","Water"];
 var s=header("Pay Bills","home")+'<div class="page"><h2>Bill Payments</h2>';
 for(var i=0;i<names.length;i++)s+=choice(names[i],"billamount");
 render(s+'</div>');
}
function billamount(){
 render(header("Bill Payment","bills")+'<div class="page" style="padding:18px"><input placeholder="Consumer / account number">'+
 '<input inputmode="decimal" placeholder="Amount"><button class="btn" style="width:100%;margin:16px 0" data-go="review">CONTINUE</button></div>');
}
function scan(){
 render(header("Scan & Pay","home")+'<div class="page"><div class="scan">⌜　　　　　⌝<br>Position QR inside frame<br>⌞　　　　　⌟</div>'+
 choice("Enter payee manually","amount")+'</div>');
}
function generic(title,back){
 render(header(title,back||"home")+'<div class="page"><h2>'+title+'</h2>'+
 '<div class="card">Select an option to continue.</div>'+choice("View Details","success")+
 choice("Explore Options","success")+choice("Service Requests","success")+'</div>');
}
function choice(label,target){return '<button class="choice" data-go="'+target+'">'+label+'　›</button>';}

function go(name){
 var routes={
 landing:landing,login:login,home:home,accountdetails:accountdetails,transfer:transfer,beneficiaries:beneficiaries,
 addbeneficiary:addbeneficiary,amount:amount,review:review,success:success,bills:bills,
 billamount:billamount,scan:scan
 };
 if(routes[name]){routes[name]();return;}
 var titles={
 addmoney:"Add Money",insights:"Insights",upi:"UPI Linked Accounts",deposits:"Deposits",
 loan:"Personal Loan",overseas:"Overseas Transfer",portfolio:"digiPortfolio",more:"More"
 };
 generic(titles[name]||"DBS","home");
}
landing();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>

</body>
</html>
